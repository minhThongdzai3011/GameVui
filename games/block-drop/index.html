<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Block Drop — GameVui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <a class="back" href="../../index.html">← Về GameVui</a>
      <section class="shell">
        <header><div><p>FALLING BLOCKS</p><h1>Block Drop</h1></div><button id="pause" class="pause">Ⅱ</button></header>
        <div class="stats"><span>ĐIỂM <b id="score">0</b></span><span>HÀNG <b id="lines">0</b></span><span>LEVEL <b id="level">1</b></span></div>
        <div class="game-area">
          <aside class="side left-side"><p>GIỮ</p><canvas id="hold" width="120" height="100"></canvas></aside>
          <div class="board-wrap">
            <canvas id="board" width="300" height="600" aria-label="Bàn chơi Block Drop"></canvas>
            <div class="overlay" id="overlay"><strong id="overlayTitle">BLOCK DROP</strong><span id="overlayText">Xếp kín hàng để xoá chúng!</span><button id="start">BẮT ĐẦU</button></div>
          </div>
          <aside class="side next-side"><p>TIẾP THEO</p><canvas id="next" width="120" height="270"></canvas></aside>
        </div>
        <p class="help">← → di chuyển · ↑ xoay · ↓ rơi nhanh · Space thả · C giữ khối</p>
        <div class="controls" aria-label="Điều khiển Block Drop">
          <button data-action="hold">GIỮ</button><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="right">→</button><button data-action="down">↓</button><button data-action="drop" class="drop">⇩</button>
        </div>
        <button id="restart" class="restart">↻ Ván mới</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
