<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cờ Vua - GameVui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- chỉ tải đúng 12 ký hiệu quân cờ (tham số text) cho nhẹ -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%99%94%E2%99%95%E2%99%96%E2%99%97%E2%99%98%E2%99%99%E2%99%9A%E2%99%9B%E2%99%9C%E2%99%9D%E2%99%9E%E2%99%9F&display=block"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=1" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="back" href="../../index.html">← Về GameVui</a>
        <h1>Cờ Vua</h1>
        <span class="sub">♞</span>
      </header>

      <main class="layout">
        <section class="board-col">
          <div class="player" id="pTop">
            <span class="avatar"></span>
            <div class="pinfo"><b class="pname"></b><span class="pcap"></span></div>
            <span class="pturn">Đang đi</span>
          </div>

          <div class="board" id="board">
            <div class="layer" id="squares"></div>
            <div class="layer" id="marks"></div>
            <div class="layer" id="pieces"></div>

            <div class="promo" id="promo" hidden>
              <div class="promo-card">
                <p>Phong cấp thành</p>
                <div class="promo-row" id="promoRow"></div>
              </div>
            </div>

            <div class="result" id="result" hidden>
              <div class="result-card">
                <div class="result-ico" id="resIco">🏆</div>
                <h2 id="resTitle">Bạn thắng!</h2>
                <p id="resText">Chiếu hết</p>
                <div class="result-btns">
                  <button class="btn primary" id="resNew">Ván mới</button>
                  <button class="btn" id="resView">Xem bàn cờ</button>
                </div>
              </div>
            </div>
          </div>

          <div class="player" id="pBottom">
            <span class="avatar"></span>
            <div class="pinfo"><b class="pname"></b><span class="pcap"></span></div>
            <span class="pturn">Đang đi</span>
          </div>
        </section>

        <aside class="panel">
          <div class="status" id="status"><span class="dot" id="statusDot"></span><span id="statusText"></span></div>

          <div class="group">
            <label>Chế độ</label>
            <div class="seg" data-set="mode">
              <button data-v="ai">Chơi với máy</button><button data-v="pvp">Hai người</button>
            </div>
          </div>
          <div class="group" id="grpLevel">
            <label>Độ khó</label>
            <div class="seg" data-set="level">
              <button data-v="easy">Dễ</button><button data-v="medium">Vừa</button
              ><button data-v="hard">Khó</button>
            </div>
          </div>
          <div class="group" id="grpSide">
            <label>Bạn cầm quân</label>
            <div class="seg" data-set="side">
              <button data-v="w">Trắng · đi trước</button><button data-v="b">Đen</button>
            </div>
          </div>

          <div class="actions">
            <button class="btn primary" id="btnNew">Ván mới</button>
            <button class="btn" id="btnUndo">↶ Đi lại</button>
            <button class="btn" id="btnHint">💡 Gợi ý</button>
            <button class="btn" id="btnFlip">⇅ Xoay bàn</button>
            <button class="btn" id="btnTheme">🎨 Màu bàn</button>
            <button class="btn" id="btnSound">🔊 Âm thanh</button>
          </div>

          <div class="moves">
            <h3>Biên bản ván cờ</h3>
            <ol id="moveList"></ol>
          </div>
        </aside>
      </main>
    </div>
    <script src="script.js?v=1"></script>
  </body>
</html>
