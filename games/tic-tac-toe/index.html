<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tic Tac Toe - GameVui</title>
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <main class="page">
      <a class="back" href="../../index.html">← Về GameVui</a>
      <section class="panel">
        <p class="eyebrow">GAMEVUI · 2 PLAYERS</p>
        <h1>Tic Tac Toe</h1>
        <p class="help">
          Nối 3 ô liên tiếp để thắng · bấm vào <b>X</b> hoặc <b>O</b> trước khi
          đi để chọn phe · phím <kbd>1</kbd>–<kbd>9</kbd> để đánh nhanh
        </p>

        <div class="ttt">
          <div class="bar">
            <button id="btnSound" class="icon" type="button" aria-label="Tắt âm thanh">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path class="on" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/><path class="off" d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <select id="mode" aria-label="Chế độ chơi">
              <option value="easy">Dễ</option>
              <option value="medium" selected>Trung bình</option>
              <option value="hard">Không thể thắng</option>
              <option value="friend">Chơi với bạn bè</option>
            </select>
            <button id="btnRestart" class="icon" type="button" aria-label="Chơi lại từ đầu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
          </div>

          <div class="scores">
            <button type="button" class="tab" data-side="X" aria-label="Chọn phe X">
              <svg viewBox="0 0 40 40" class="mini x" aria-hidden="true"><path d="M10 10 30 30M30 10 10 30"/></svg>
              <span class="who" id="whoX">Bạn</span>
              <b id="scoreX">–</b>
            </button>
            <div class="tie"><span>Hòa</span><b id="scoreT">–</b></div>
            <button type="button" class="tab" data-side="O" aria-label="Chọn phe O">
              <svg viewBox="0 0 40 40" class="mini o" aria-hidden="true"><circle cx="20" cy="20" r="11"/></svg>
              <span class="who" id="whoO">Máy</span>
              <b id="scoreO">–</b>
            </button>
          </div>

          <div class="board-wrap">
            <svg id="board" viewBox="0 0 300 300" aria-hidden="true">
              <g class="grid">
                <line x1="100" y1="8" x2="100" y2="292" />
                <line x1="200" y1="8" x2="200" y2="292" />
                <line x1="8" y1="100" x2="292" y2="100" />
                <line x1="8" y1="200" x2="292" y2="200" />
              </g>
              <g id="marks"></g>
              <g id="win"></g>
            </svg>
            <div class="cells" id="cells"></div>
          </div>
          <p class="hint" id="hint">Bắt đầu, hoặc chọn phe</p>
        </div>
      </section>
    </main>
    <script src="script.js?v=2"></script>
  </body>
</html>
