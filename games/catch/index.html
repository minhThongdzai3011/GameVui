<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bắt vật phẩm - GameVui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <a class="back" href="../../index.html">← Về GameVui</a>

    <main class="app">
      <section class="stats">
        <div class="stat"><small>ĐIỂM</small><b id="stScore">0</b></div>
        <div class="stat"><small>MẠNG</small><b id="stLives" class="lives">♥♥♥</b></div>
        <div class="stat"><small>COMBO</small><b id="stCombo">0</b><i class="mult" id="stMult" hidden>×2</i></div>
        <div class="stat"><small>KỶ LỤC</small><b id="stBest">0</b></div>
      </section>

      <div class="field-wrap">
        <canvas id="field" aria-label="Vườn cây, hứng đồ rơi bằng rổ"></canvas>
      </div>

      <nav class="tools">
        <button class="tool" id="btnPause" title="Tạm dừng (P / Esc)">⏸ Tạm dừng</button>
        <button class="tool" id="btnSound">🔊 Âm thanh</button>
        <button class="tool" id="btnRestart">↻ Chơi lại</button>
      </nav>
      <p class="keys">Rê chuột hoặc <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> để di chuyển rổ · <kbd>P</kbd> / <kbd>Esc</kbd> tạm dừng</p>
    </main>

    <div class="overlay" id="overlay" hidden>
      <div class="card">
        <div class="ico" id="cIco"></div>
        <h2 id="cTitle"></h2>
        <div id="cBody"></div>
        <div class="btns" id="cBtns"></div>
      </div>
    </div>

    <script src="script.js?v=3"></script>
  </body>
</html>
