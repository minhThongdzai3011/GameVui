<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dino Runner - GameVui</title>
    <link rel="stylesheet" href="style.css?v=3" />
  </head>
  <body>
    <main class="page">
      <a class="back" href="../../index.html">← Về GameVui</a>
      <section class="panel">
        <p class="eyebrow">GAMEVUI · ENDLESS RUNNER</p>
        <h1>Dino Runner</h1>
        <p class="help">
          <kbd>Space</kbd> / <kbd>↑</kbd> hoặc chạm màn hình để nhảy ·
          <kbd>↓</kbd> để cúi hoặc rơi nhanh
        </p>
        <div class="stage" id="stage">
          <canvas id="game" aria-label="Màn chơi Dino Runner"></canvas>
          <p class="start-hint">Nhấn Space hoặc chạm để bắt đầu</p>
        </div>
        <div class="controls">
          <button id="btnJump" type="button">▲ NHẢY</button>
          <button id="btnDuck" type="button">▼ CÚI</button>
        </div>
        <button class="restart" id="restart" type="button">Chơi lại</button>
      </section>
    </main>
    <script src="script.js?v=3"></script>
  </body>
</html>
